stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

# ====================================================================
# STAGE 1: TEST (Node 24, Typecheck, Unit Test, Next.js Build Export)
# ====================================================================
test:
  stage: test
  image: node:24-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npx vitest run
    - npm run build

# ====================================================================
# STAGE 2: BUILD & PUSH (Kaniko Rootless Builder)
# ====================================================================
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"'
  before_script:
    - mkdir -p /kaniko/.docker
    - 'echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json'
  script:
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${DOCKER_IMAGE_NAME}" --cache=true

# ====================================================================
# STAGE 3: DEPLOY (Local Runner on phuhoangserver)
# ====================================================================
deploy:
  stage: deploy
  image: docker:27-cli
  tags:
    - phuhoangserver
  resource_group: production-canvas
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - apk add --no-cache curl bash
  script:
    - /home/phuhoang/projects/canvas/deploy.sh "${CI_COMMIT_SHA}"
  after_script:
    - docker logout "$CI_REGISTRY"
